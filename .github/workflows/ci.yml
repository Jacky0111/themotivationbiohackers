name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (non-blocking, pre-existing issues)
        run: bun run lint
        continue-on-error: true

      - name: Run tests (includes events detail e2e)
        run: bunx vitest run --reporter=verbose


      - name: Build
        run: bun run build

      - name: Audit dependencies (high/critical)
        run: bun audit --audit-level=high
